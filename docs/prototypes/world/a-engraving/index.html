<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1F24">
<title>Venetie, The Engraving</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <section id="world" aria-label="The Arsenale water street, showing six hulls at their stations">
    <canvas id="water" aria-hidden="true"></canvas>
    <canvas id="city" aria-hidden="true"></canvas>
    <canvas id="ships" aria-hidden="true"></canvas>
    <div id="marks"></div>

    <header id="hud">
      <div class="purse">
        <span class="k" data-f="Treasury" data-p="Rate limit left">Treasury</span>
        <div class="v"><b id="tre">32%</b><span class="u">left</span></div>
        <div class="meter" id="meter" aria-hidden="true"></div>
      </div>
      <div class="title" aria-hidden="true">
        <span class="venetie">VENETIE</span>
        <div id="tess" aria-label="Gold tesserae earned"></div>
      </div>
      <div class="purse r">
        <span class="k">Renown</span>
        <div class="v"><b id="ren">1,284</b></div>
        <span class="s" id="rank">Marangone</span>
        <span class="tog"><button id="plain" aria-pressed="false">Plain</button><button id="snd" aria-pressed="true">Sound</button></span>
      </div>
    </header>

    <button id="weather" aria-label="Weather. Tap to try another rate limit level.">
      <span class="wk" id="wname">Wind</span>
      <span class="wv" id="wval">68% of limit</span>
    </button>

    <div id="sensa" aria-live="polite">
      <div class="ribbon">
        <p class="lat"><i>Desponsamus te, mare</i></p>
        <p class="pl" id="sensaPlain">Aurora is published.</p>
        <p class="ln" id="sensaLink"></p>
      </div>
    </div>
  </section>

  <aside id="folio" aria-label="Selected hull and live chronicle">
    <div class="runhead"><span>Venezia</span><span id="runfol">fol. xxvi</span></div>
    <div id="detail"></div>
    <h3 class="rub"><span data-f="Chronicle" data-p="Activity">Chronicle</span></h3>
    <ol id="feed" aria-live="off"></ol>
    <h3 class="rub"><span data-f="Mosaic" data-p="Verified results">Mosaic</span></h3>
    <div id="mosaic" aria-hidden="true"></div>
  </aside>

  <section id="console">
    <div id="tray">
      <article id="card" aria-live="assertive" aria-hidden="true">
        <div class="body">
          <p class="kick" id="cKick">Needs you</p>
          <h2 id="cTitle"></h2>
          <p id="cBody"></p>
        </div>
        <button id="ring" aria-label="Hold for two seconds to publish, then release">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6D777"/><stop offset=".45" stop-color="#C8922A"/><stop offset=".6" stop-color="#FFF0B8"/><stop offset="1" stop-color="#8E6A1E"/></linearGradient></defs>
            <circle cx="50" cy="50" r="44" fill="none" stroke="#1B1A17" stroke-width=".8" stroke-dasharray="1.2 3.4"/>
            <circle cx="50" cy="50" r="31" fill="none" stroke="url(#gg)" stroke-width="11"/>
            <circle cx="50" cy="50" r="36.7" fill="none" stroke="#5A3C0C" stroke-width=".9"/>
            <circle cx="50" cy="50" r="25.3" fill="none" stroke="#5A3C0C" stroke-width=".9"/>
            <circle id="ringArc" cx="50" cy="50" r="44" fill="none" stroke="#C8391F" stroke-width="4.5" stroke-linecap="butt" transform="rotate(-90 50 50)" pathLength="100" stroke-dasharray="0 100"/>
          </svg>
          <span id="ringLabel">Hold</span>
        </button>
      </article>
      <div id="tape" role="status"><span id="tapeText"></span></div>
    </div>

    <div id="deck" role="group" aria-label="Control deck">
      <canvas id="plate" aria-hidden="true"></canvas>
      <svg id="voiceRule" aria-hidden="true"><rect id="vr" fill="none"/></svg>
      <div class="lamps" id="lamps"></div>
      <div class="dialbox">
        <div id="dial" role="slider" tabindex="0" aria-label="Effort for the next worker" aria-valuemin="1" aria-valuemax="4" aria-valuenow="2" aria-valuetext="Medium">
          <div class="well"></div>
          <div class="knurl" id="knurl"></div>
          <div class="spun"></div>
          <div class="mark" id="mark"></div>
        </div>
        <div class="dlabels" id="dlabels" aria-hidden="true"></div>
        <span class="dcap">Effort</span>
      </div>
      <button class="key rej" id="reject" aria-keyshortcuts="n"><span class="cap"><span class="lg">Reject</span><span class="ks">N</span></span></button>
      <button class="key app" id="approve" aria-keyshortcuts="y"><span class="cap"><span class="lg" id="appLabel">Approve</span><span class="ks">Y</span></span></button>
      <button class="key talk" id="talk" aria-keyshortcuts="Space"><span class="cap"><canvas id="vox" aria-hidden="true"></canvas><span class="lg" id="talkLabel">Hold to talk</span><span class="ks">Space</span></span></button>
    </div>
  </section>
</main>
<script src="world.js"></script>
<script src="water.js"></script>
<script src="ships.js"></script>
<script src="audio.js"></script>
<script src="deck.js"></script>
<script src="app.js"></script>
</body>
</html>
