<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Venezia Diorama</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0B1F24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="world" aria-label="A live miniature of the Arsenale. Drag to turn it. Tap a hull to follow it."></canvas>
<div id="labels" aria-hidden="true"></div>
<div id="fly" aria-hidden="true"></div>

<header id="hud">
  <button class="hud-cell" id="hudTreasury" title="Rate limit window">
    <span class="hud-k" data-f="Treasury" data-p="Budget">Treasury</span>
    <span class="hud-v"><b id="ducats">412</b><small data-f="ducats" data-p="left">ducats</small></span>
    <span class="hud-s" id="windowLeft">37% left, 1h 12m</span>
  </button>
  <button class="hud-cell weather" id="hudWeather" title="Weather is the rate limit. Tap to change it.">
    <span class="hud-k">Weather</span>
    <span class="hud-v"><svg id="vane" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 2 15.2 13.4 12 11.4 8.8 13.4Z" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><path d="M12 13V22" stroke="currentColor" stroke-width="1.4"/></svg><b id="weatherName">Wind</b></span>
    <span class="hud-s" id="weatherSub">63% of window used</span>
  </button>
  <div class="hud-cell renown">
    <span class="hud-k" data-f="Renown" data-p="Score">Renown</span>
    <span class="hud-v"><b id="renown">1,240</b><small id="rank">Proto</small></span>
    <span class="tiles" id="tiles" aria-label="Verified results"></span>
  </div>
  <button class="plain-toggle" id="plainToggle" aria-pressed="false">Plain</button>
  <button class="sound-toggle" id="soundToggle" aria-pressed="true" aria-label="Sound">
    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2 6v4h3l4 3V3L5 6Z" fill="currentColor"/><path class="w" d="M11 5.2a4 4 0 0 1 0 5.6" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
  </button>
</header>

<aside id="feed" aria-label="Live feed">
  <h2><span data-f="The Chronicle" data-p="Live feed">The Chronicle</span></h2>
  <ol id="feedList"></ol>
</aside>

<aside id="detail" aria-live="polite"></aside>

<section id="console">
  <article id="card" aria-live="assertive">
    <h1 id="cardTitle">Aurora wants to publish to GitHub Pages.</h1>
    <div class="card-row"><p id="cardBody">14 files, public link. Gate passed.</p><span class="stamp" id="cardStamp" aria-hidden="true">Verified</span></div>
    <div class="card-foot">
      <p id="cardHint">Hold the ring for 2 seconds. Reject keeps it private.</p>
      <svg class="point" viewBox="0 0 28 28" width="20" height="20" aria-hidden="true"><path d="M5 5C14 6 20 11 22 21M22 21l-6-4M22 21l3-7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </div>
    <button id="replay" hidden>Run the ceremony again</button>
  </article>

  <div id="deck" role="group" aria-label="Control deck">
    <i class="perimeter" aria-hidden="true"></i>
    <i class="slot" aria-hidden="true"></i>
    <i class="screw s1" aria-hidden="true"></i><i class="screw s2" aria-hidden="true"></i><i class="screw s3" aria-hidden="true"></i><i class="screw s4" aria-hidden="true"></i>

    <div id="lamps" role="group" aria-label="Six hull lamps"></div>

    <div class="deck-low">
      <div class="deck-left">
        <div class="tape" aria-live="polite">
          <div class="tape-paper"><span id="tapeText">Forty hands on the street.</span></div>
          <canvas id="voice" width="400" height="60" aria-hidden="true"></canvas>
        </div>
        <div class="keyrow">
          <button class="key reject" id="reject"><span class="well"></span><span class="cap"><span class="glyph" aria-hidden="true">
            <svg viewBox="0 0 12 12" width="11" height="11"><path d="M2 2 10 10M10 2 2 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span class="legend">Reject</span></span></button>
          <button class="key approve" id="approve"><span class="well"></span><span class="cap"><span class="glyph" aria-hidden="true">
            <svg viewBox="0 0 12 12" width="12" height="12"><path d="M1.5 6.5 4.6 9.6 10.5 2.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="legend">Approve</span></span></button>
        </div>
        <button class="key talk" id="talk"><span class="well"></span><span class="cap"><span class="grille" aria-hidden="true"></span><span class="legend">Hold to talk</span></span></button>
      </div>

      <div id="dial" role="slider" tabindex="0" aria-label="Effort dial. Hold the centre ring to publish." aria-valuemin="0" aria-valuemax="3" aria-valuenow="1">
        <svg class="dial-scale" viewBox="0 0 140 140" aria-hidden="true">
          <g id="dialTicks"></g>
        </svg>
        <div class="knurl"></div>
        <div class="dome"><i class="index"></i></div>
        <div class="ring" id="ring"><span id="ringLabel">Ring</span></div>
        <svg class="dial-arc" viewBox="0 0 140 140" aria-hidden="true"><circle class="ring-arc" id="ringArc" cx="70" cy="70" r="36" pathLength="100" transform="rotate(-90 70 70)"/></svg>
      </div>
    </div>
  </div>
</section>

<div id="nogl" hidden>This model needs WebGL 2. The deck below still works.</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="world.js"></script>
<script src="app.js"></script>
</body>
</html>
